# Names for the functions the Switch code hooks, added to the manifest by tools/codegen.sh (Title Update 6 addresses,
# disc 1). Each name turns on its hook (CMakeLists.txt defines MP3_TIENE_<name>): GTA IV's hooks (src/) are written for
# GTA IV's functions and wait here until Max Payne 3's counterpart is found and checked against them. Names carry the
# mp3_ prefix: the SDK defines __imp__ stubs for many XDK names (D3DDevice_Create*Shader ...).
#
# Wanted first, in the order GTA IV needed them (gta4/PORTING.md):
#   mp3_D3DDevice_BeginTiling          predicated tiling off (src/mp3_tiling.cpp): without it only the first band
#   mp3_D3DDevice_CreateVertexShader   the shader dump (src/mp3_shader_dump.cpp)
#   mp3_D3DDevice_CreatePixelShader
#   mp3_SpinLockAcquire, mp3_D3D_WaitStep, mp3_D3D_QueryFramesInFlight   spin waits that take cores (src/mp3_perf_hooks.cpp)

# XDK Direct3D: every shader the game creates (src/mp3_shader_dump.cpp, the shader dump and the library's object
# addresses; CMake compiles those hooks when both names are here). Found with tools/fuzzy_find.py against ds3-nx's named
# tree (Dead Space 3, a 2012-2013 XDK too): both instruction for instruction ds3's (60 instructions, ratio 1.0; each
# other's neighbour at 0.917).
[functions."0x83080390"]
name = "mp3_D3DDevice_CreateVertexShader"

[functions."0x830801A8"]
name = "mp3_D3DDevice_CreatePixelShader"

# XDK Direct3D: BeginTiling (r3 device, r4 flags, r5 tile count, r6 tile rects of 16 bytes: x1 y1 x2 y2, r7 clear color,
# f1 clear z). Run 10's trace showed the G-buffer drawn twice (two predicated tiles, resolves 384 rows apart, SET_BIN_MASK
# / SET_BIN_SELECT in the ring) and the scene came out white: src/mp3_tiling.cpp makes it one tile, as for GTA IV. Found
# with tools/fuzzy_find.py against GTA IV's tree (TU8's gta4_D3DDevice_BeginTiling, generated from the user's own
# executable for the comparison only): ratio 0.734 (293 against 219 instructions, the 2012 XDK's version), the next
# 0.267; the same use of its arguments (the count stored in the device, +13124 here, +12740 in GTA IV; each rect's
# corners read and aligned to 32).
[functions."0x83079948"]
name = "mp3_D3DDevice_BeginTiling"

# One step of Direct3D's waits for the GPU (r3 = 1 while the caller keeps waiting): src/mp3_perf_hooks.cpp yields, then
# sleeps between steps. ds3-nx's D3D_GpuWaitStep exactly (ratio 1.0), GTA IV's gta4_D3D_WaitStep at 0.807.
[functions."0x83076C70"]
name = "mp3_D3D_WaitStep"

# The game's spin lock acquire (r3 = lock word): compare-and-swap 0 -> 1 through sub_82CC0450, between tries an empty
# counting loop doubling from 8 to 1024. GTA IV's gta4_SpinLockAcquire instruction for instruction (tools/fuzzy_find.py
# against GTA IV's tree: ratio 1.0, next 0.65). src/mp3_perf_hooks.cpp yields, then sleeps, instead of spinning: run 15's
# threads spent much of their samples in lock waits.
[functions."0x8220D850"]
name = "mp3_SpinLockAcquire"

# Direct3D's frames-in-flight query (r4 = a 12-byte result; +8 = frames submitted but not retired): GTA IV's
# gta4_D3D_QueryFramesInFlight exactly (ratio 1.0; the device offsets 16968/16976 here, 16544/16552 in GTA IV).
# src/mp3_perf_hooks.cpp sleeps while two or more are in flight instead of asking again at once.
[functions."0x830853E8"]
name = "mp3_D3D_QueryFramesInFlight"

# The XAudio2 processing thread's entry (the XDK's mixer, started once with a 1 MB stack): run 16's busiest thread at
# ~69 % of a core (sub_8301B028, sub_82C7xxxx, sub_83037BC0 under it). src/mp3_perf_hooks.cpp makes it prefer core 3
# (the console's hbl.nsp opens it to homebrew), as GTA IV's gta4_AudioThreadEntry did, so cores 0-2 are left to the game.
[functions."0x83037B30"]
name = "mp3_AudioThreadEntry"
