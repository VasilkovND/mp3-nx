# XAudio2: one mono voice mixed into a 5.1 bus with a per-channel gain ramp (r3 = a job: +0 input, +4 interleaved
# 6-channel output, +8 gains, +12 steps or 0, +20 frames, +32 add). Run 27's busiest audio function (13.5 % of a core
# at stock clocks): src/mp3_audio_mix_neon.cpp does it in NEON (mp3_mezcla_neon).
[functions."0x8301B028"]
name = "mp3_XAudioMixMonoTo6"

# The game's render thread entry (started once; it sets up, then runs sub_821FFDC8, the loop that builds and submits each
# frame, until shutdown). src/mp3_perf_hooks.cpp registers the thread for mp3_prioridad_render (GTA IV's
# gta4_RenderThreadLoop, sub_821B6F18 there). Run 27 at stock: the main thread waits on it (sub_8222DF48) while it waits
# for a core: all four were 85-90 % busy.
[functions."0x82200AB8"]
name = "mp3_RenderThreadLoop"

# The game's job worker thread entry (several threads: r3 = the queue object, the loop takes jobs through
# sub_82DAD1B8). Only its priority is set (mp3_prioridad_trabajos, src/mp3_perf_hooks.cpp mp3_JobWorkerMp3); GTA IV's
# mp3_JobWorker reads GTA IV's queue layout and stays unnamed.
[functions."0x82DADC08"]
name = "mp3_JobWorkerMp3"

# RAGE's command-line parameter registration (each of the game's 410 PARAMs: a static constructor calls it with the
# object; r5 = its name; it zeroes the value text at +4, which the command line fills later). src/mp3_detail.cpp turns
# on, right after this, the parameters of the detail settings (removetopmips, cheapaudioeffects ...).
[functions."0x82CB10C8"]
name = "mp3_ParamRegister"

# The audio mixer's effect DSP (stack samples at stock clocks, % of a core), in native code bit for bit in
# src/mp3_audio_dsp_mp3.cpp (checked on the Mac against the generated code; each has a cvar to switch it off).
# The reverb (Freeverb: 8 damped combs, 4 all-passes per channel; r3 = the effect, r5 samples, r6 per channel, r7
# channels), ~9-10 %: mp3_dsp_reverb_mp3.
[functions."0x82C76208"]
name = "mp3_AudioReverbMp3"

# The master look-ahead peak limiter (r3 = the effect, r4 its parameters; +32 of them zero: an RMS compressor, left to
# the original), ~4-6 %: mp3_dsp_limiter_mp3.
[functions."0x82C745A8"]
name = "mp3_AudioLimiterMp3"

# The per-channel biquad, one or two in series (r3 = the effect: coefficients +156, states +176..+248, mask +276,
# series flag +277), ~2-3 %: mp3_dsp_biquad_mp3.
[functions."0x82C735E0"]
name = "mp3_AudioBiquadMp3"

# XAudio2's resampler of 16-bit PCM to float (linear interpolation, 32.32 fixed-point position; f1 = rate, r3 the
# source, r4 the output, r5 outputs, r6 the float fractional position, r3 back = source samples advanced), ~5 %:
# mp3_dsp_remuestreo_mp3.
[functions."0x8303ECE0"]
name = "mp3_XAudioResampleMp3"

